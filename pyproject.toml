[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maintain-predict"
version = "0.1.0"
description = "Machine failure risk prediction using the AI4I 2020 dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "huggingface_hub",
    "numpy",
    "pandas",
    "pydantic",
    "scikit-learn",
    "skops",
    "uvicorn",
]

[project.optional-dependencies]
train = [
    "matplotlib",
    "mlflow",
    "shap",
    "xgboost",
]
demo = ["gradio"]
dev = [
    "httpx",
    "jupyterlab",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
